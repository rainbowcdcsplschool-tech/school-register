<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Account Register</title>
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#14283a;--mute:#5d6f7d;--line:#d3dde3;--acc:#0b6e6e;--acc-ink:#fff;--warn:#b3261e;--hi:#e7f3f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--card:#17252f;--ink:#e6eef3;--mute:#93a6b3;--line:#2b3d49;--acc:#4fc0b8;--acc-ink:#0b1a20;--warn:#ff8a80;--hi:#1c3340;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a22;--card:#17252f;--ink:#e6eef3;--mute:#93a6b3;--line:#2b3d49;--acc:#4fc0b8;--acc-ink:#0b1a20;--warn:#ff8a80;--hi:#1c3340;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{padding:18px 16px 8px;max-width:1100px;margin:auto}
h1{margin:0;font-size:1.5rem;letter-spacing:.2px}
header p{margin:2px 0 0;color:var(--mute)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;max-width:1100px;margin:auto}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:8px;font:inherit;cursor:pointer}
nav button[aria-selected="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:1100px;margin:auto;padding:6px 16px 40px}
.filter-bar{max-width:1100px;margin:0 auto 10px;padding:0 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filter-bar label{flex-direction:row;align-items:center;gap:8px;font-size:.9rem;font-weight:600;color:var(--ink)}
.filter-bar select{width:auto;min-width:180px;background:var(--card)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.panel h2{margin:0 0 12px;font-size:1.05rem}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--mute)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%}
input[readonly]{background:var(--hi);font-weight:600}
.btn{border:0;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:600;padding:10px 14px;border-radius:6px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn:disabled{opacity:.6;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:8px;padding:10px 12px}
.stat span{display:block;color:var(--mute);font-size:.8rem}
.stat b{font-size:1.25rem}
.neg{color:var(--warn)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.8rem;color:var(--mute);font-weight:600}
td.n,th.n{text-align:right}
tfoot td{font-weight:700;background:var(--hi)}
.x{background:none;border:0;color:var(--warn);cursor:pointer;font-size:1rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools input{max-width:240px}
.empty{color:var(--mute);padding:14px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
@media print{nav,form,.tools,.x,.noprint,.filter-bar{display:none!important}body{background:#fff;color:#000}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100}
.toast.show{opacity:1}
#billView{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);overflow:auto;padding:14px;z-index:50}
.bar{max-width:210mm;margin:0 auto 10px;display:flex;gap:8px}
.sheet{background:#fff;color:#111;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:0 14mm 14mm;font-size:14px;line-height:1.5}
.sheet .rb{height:8px;margin:0 -14mm;background:linear-gradient(90deg,#e53935,#fb8c00,#fdd835,#43a047,#1e88e5,#8e24aa)}
.sheet .bh{text-align:center;padding:14px 0 10px;border-bottom:2px solid #0b6e6e}
.sheet .bh h2{margin:0 0 4px;font-size:26px;color:#0b6e6e}
.sheet .bh p{margin:2px 0;font-size:12.5px}
.sheet h3{text-align:center;letter-spacing:3px;margin:16px 0 12px;font-size:17px}
.sheet .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sheet table{min-width:0;margin:14px 0}
.sheet th,.sheet td{color:#111;border:1px solid #9aa7ae;padding:8px 10px;white-space:normal}
.sheet th{background:#eaf1f2;color:#111}
.sheet tfoot td{background:#e7f3f2;color:#111;font-size:15px}
.sheet .sign{display:flex;justify-content:space-between;margin-top:90px;font-size:13px}
.sheet .sign div{border-top:1px solid #111;padding-top:4px;min-width:200px;text-align:center}
.sheet .ty{text-align:center;margin-top:40px;color:#444;font-size:12.5px}
@page{size:A4;margin:0}
@media print{body.billing>*:not(#billView){display:none!important}body.billing{background:#fff}#billView{position:static;background:none;padding:0;overflow:visible}.bar{display:none}.sheet{width:210mm;min-height:297mm}}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hd-actions{display:flex;gap:8px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
#bgFrame{width:100%;border:0;display:block;min-height:600px;background:transparent}
.arow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{flex-direction:row;align-items:center;gap:5px;color:var(--ink);font-size:.9rem;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;background:var(--bg)}
.seg input{width:auto;padding:0}
tr.grp td{background:var(--hi);font-weight:700}
#loginView{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:380px}
.lcard h2{margin:0 0 4px;font-size:1.2rem}.lcard p{margin:0 0 14px;color:var(--mute)}
.lcard label{margin-bottom:10px}.lcard .btn{width:100%;margin-top:4px}
#lgMsg{min-height:1.3em;margin-top:10px;color:var(--warn);font-size:.9rem}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div>
      <h1>School account register</h1>
      <p>Van fuel, staff pay, expenses and student fees in one place. Entries are saved in this browser and sent to your Google Sheet.</p>
    </div>
    <div class="hd-actions noprint">
      <span id="who" style="display:none;align-self:center;color:var(--mute);font-size:.9rem"></span>
      <button id="uploadAllBtn" class="btn ghost" onclick="uploadAllLocal()">&#8593; Upload All Local Data</button>
      <button id="syncBtn" class="btn" onclick="syncNow()">&#8635; Sync</button>
      <button id="logoutBtn" class="btn ghost" style="display:none" onclick="logout()">Log out</button>
    </div>
  </div>
</header>
<nav id="tabs" role="tablist"></nav>
<div id="monthBar" class="filter-bar noprint"></div>
<main id="view"></main>

<script>
var KEY='schoolAccountRegister_v1';
function EMPTY(){return {fuel:[],repair:[],salary:[],expense:[],fees:[],children:[],attendance:[]};}
var DB=EMPTY();
function loadDB(){DB=EMPTY();try{var s=localStorage.getItem(KEY);if(s)DB=Object.assign(DB,JSON.parse(s));}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
var today=new Date().toISOString().slice(0,10);
var SESS=['2025-26','2026-27','2027-28'];
var MONTHS=['April','May','June','July','August','September','October','November','December','January','February','March'];
var MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
var MODES=['Cash','UPI','Bank','Cheque'];
var inr=function(n){return '\u20B9'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});};

var MOD={
 fuel:{title:'Van fuel',group:'fuelType',gl:'Fuel type',fields:[
  {k:'date',l:'Date',t:'date'},
  {k:'van',l:'Van no.',t:'text',ph:'DL 1V 1234'},
  {k:'fuelType',l:'Fuel',t:'sel',o:['CNG','Petrol']},
  {k:'amount',l:'Amount (\u20B9)',t:'num'},
  {k:'mode',l:'Mode',t:'sel',o:MODES},
  {k:'note',l:'Remarks',t:'text',opt:1}]},
 repair:{title:'Van maintenance & repair',group:'work',gl:'Work type',fields:[
  {k:'date',l:'Date',t:'date'},{k:'van',l:'Van no.',t:'text',ph:'DL 1V 1234'},
  {k:'work',l:'Work type',t:'sel',o:['Regular service','Repair','Tyre / tube','Battery','Oil change','CNG kit / cylinder','Insurance / fitness / permit','Cleaning / washing','Other']},
  {k:'shop',l:'Workshop / shop',t:'text',opt:1},
  {k:'amount',l:'Amount (\u20B9)',t:'num'},{k:'mode',l:'Mode',t:'sel',o:MODES},
  {k:'note',l:'Details',t:'text',opt:1}]},
 salary:{title:'Staff salary & advance',group:'type',gl:'Entry type',fields:[
  {k:'date',l:'Date',t:'date'},{k:'staff',l:'Staff name',t:'text'},
  {k:'month',l:'For month',t:'sel',o:MONTHS},
  {k:'type',l:'Entry type',t:'sel',o:['Salary paid','Advance given','Advance recovered']},
  {k:'amount',l:'Amount (\u20B9)',t:'num'},{k:'mode',l:'Mode',t:'sel',o:MODES},
  {k:'note',l:'Remarks',t:'text',opt:1}]},
 expense:{title:'School wages & expenses',group:'category',gl:'Category',fields:[
  {k:'date',l:'Date',t:'date'},
  {k:'category',l:'Category',t:'sel',o:['Wages (helper / driver)','Electricity','Water','Stationery','Repair & maintenance','Events','Rent','Other']},
  {k:'paidTo',l:'Paid to',t:'text'},{k:'amount',l:'Amount (\u20B9)',t:'num'},
  {k:'mode',l:'Mode',t:'sel',o:MODES},{k:'note',l:'Details',t:'text',opt:1}]},
 fees:{title:'Children fees',group:'source',gl:'Fee source',fields:[
  {k:'date',l:'Date',t:'date'},{k:'receipt',l:'Receipt no.',t:'text',opt:1},
  {k:'child',l:'Child name',t:'text',dl:'children'},
  {k:'source',l:'Fee from',t:'sel',o:['Session','School / day care']},
  {k:'amount',l:'Amount (\u20B9)',t:'num'},
  {k:'month',l:'For month',t:'sel',o:MONTHS},
  {k:'mode',l:'Mode',t:'sel',o:MODES},{k:'note',l:'Remarks',t:'text',opt:1}]},
 children:{title:'Child data',plain:1,group:'program',gl:'Program',fields:[
  {k:'date',l:'Joining date',t:'date'},{k:'name',l:'Child name',t:'text'},{k:'age',l:'Age',t:'text',opt:1,ph:'e.g. 6 years'},
  {k:'parent',l:'Parent / guardian',t:'text',opt:1},{k:'phone',l:'Mobile no.',t:'text',opt:1},{k:'address',l:'Address',t:'text',opt:1},
  {k:'program',l:'Program',t:'sel',o:['Session','School / day care','Both']},{k:'note',l:'Remarks',t:'text',opt:1},
  {k:'teacher',l:'Teacher / therapist',t:'text',opt:1,dl:'teachers'}]},
 attendance:{title:'Attendance',custom:1,group:'status',gl:'Status',fields:[
  {k:'date',l:'Date',t:'date'},{k:'teacher',l:'Teacher / therapist',t:'text'},{k:'child',l:'Child name',t:'text'},
  {k:'status',l:'Status',t:'sel',o:['Present','Absent','Leave']},{k:'note',l:'Remarks',t:'text',opt:1}]}
};

var SHEET_URL='https://script.google.com/macros/s/AKfycbzmOjwy3fR8_D9BSjPLIY7RNIvX7FMbFMHmbR4N9bvTq4SIPalwETUaouxGhjOb2HBH8Q/exec';

var toastTimer;
function toast(m){var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}
  t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},3500);}
function clean(r){var o={};Object.keys(r).forEach(function(x){if(x.charAt(0)!=='_')o[x]=r[x];});return o;}
var AUTH=!!SHEET_URL,SES=null,SKEY='schoolRegisterSession';
function isTeacher(){return !!(SES&&SES.role==='teacher');}
function chk(j){
  if(j&&j.error==='auth'){SES=null;try{sessionStorage.removeItem(SKEY);}catch(e){}showLogin('Your session ended. Please log in again.');throw new Error('Session ended. Please log in again.');}
  if(!j||j.ok===false)throw new Error((j&&j.error)||'Request failed');
  return j;
}
function post(p){
  if(SES)p.token=SES.token;
  return fetch(SHEET_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)}).then(function(r){return r.json();}).then(chk);
}
function showLogin(msg){
  var v=document.getElementById('loginView');
  if(!v){v=document.createElement('div');v.id='loginView';document.body.appendChild(v);}
  v.innerHTML='<div class="lcard"><h2>Rainbow Child Development Center</h2><p>Log in to open the register.</p>'+
   '<label>User name<input id="lgUser" autocomplete="username" autocapitalize="none"></label>'+
   '<label>Password<input id="lgPass" type="password" autocomplete="current-password"></label>'+
   '<button class="btn" id="lgBtn" type="button">Log in</button><div id="lgMsg" role="alert">'+esc(msg||'')+'</div></div>';
  document.getElementById('lgBtn').onclick=doLogin;
  document.getElementById('lgPass').onkeydown=function(e){if(e.key==='Enter')doLogin();};
  document.getElementById('lgUser').onkeydown=function(e){if(e.key==='Enter')document.getElementById('lgPass').focus();};
  document.getElementById('who').style.display='none';document.getElementById('logoutBtn').style.display='none';
  setTimeout(function(){document.getElementById('lgUser').focus();},50);
}
function doLogin(){
  var u=document.getElementById('lgUser').value.trim(),p=document.getElementById('lgPass').value;
  var m=document.getElementById('lgMsg'),b=document.getElementById('lgBtn');
  if(!u||!p){m.textContent='Enter your user name and password.';return;}
  b.disabled=true;m.style.color='var(--mute)';m.textContent='Checking\u2026';
  post({action:'login',user:u,pass:p}).then(function(j){
    SES={token:j.token,role:j.role,teacher:j.teacher||'',name:j.name};
    try{sessionStorage.setItem(SKEY,JSON.stringify(SES));}catch(e){}
    startApp();
  }).catch(function(e){
    m.style.color='var(--warn)';
    m.textContent=(e&&e.message&&e.message!=='Failed to fetch')?e.message:'Cannot reach the server. Check your internet connection and the web app link.';
    b.disabled=false;
  });
}
function startApp(){
  var lv=document.getElementById('loginView');if(lv)lv.remove();
  KEY=isTeacher()?'schoolRegisterTeacher_'+String(SES.name).toLowerCase().replace(/[^a-z0-9]/g,''):'schoolAccountRegister_v1';
  loadDB();
  if(SES){var w=document.getElementById('who');w.textContent=SES.name+' ('+SES.role+')';w.style.display='';document.getElementById('logoutBtn').style.display='';}
  document.getElementById('uploadAllBtn').style.display=isTeacher()?'none':'';
  if(isTeacher()){tab='attendance';attSel.teacher=SES.teacher;attSel.all=false;}
  draw();
  if(SES)syncNow(true);
}
function logout(){
  SES=null;try{sessionStorage.removeItem(SKEY);}catch(e){}
  DB=EMPTY();tab='home';selMonth='ALL';q='';
  document.getElementById('view').innerHTML='';document.getElementById('tabs').innerHTML='';document.getElementById('monthBar').innerHTML='';
  showLogin('');
}
function boot(){
  if(AUTH){try{var s=sessionStorage.getItem(SKEY);if(s)SES=JSON.parse(s);}catch(e){}if(SES&&SES.token)startApp();else{SES=null;showLogin('');}}
  else{loadDB();draw();}
}
function sendToSheet(k,r){
  if(!SHEET_URL)return;
  post({module:k,row:clean(r)})
   .then(function(){delete r._u;save();toast('Saved here and sent to Google Sheet');})
   .catch(function(){r._u=1;save();toast('Saved here, not sent yet. Press Sync when online.');});
}

var syncing=false;

function uploadAllLocal(){
  if(!SHEET_URL||syncing)return;
  var total=0;
  Object.keys(MOD).forEach(function(k){total+=DB[k].length;});
  if(!total){toast('No local entries found to upload.');return;}
  if(!confirm('This will upload all '+total+' entries currently saved in this browser to your Google Sheet. Only click this once to avoid duplicate rows. Continue?'))return;
  
  syncing=true;
  var ub=document.getElementById('uploadAllBtn');
  var sb=document.getElementById('syncBtn');
  ub.disabled=true;sb.disabled=true;
  
  var sent=0;
  var chain=Promise.resolve();
  Object.keys(MOD).forEach(function(k){
    DB[k].forEach(function(r){
      chain=chain.then(function(){
        sent++;
        ub.textContent='Uploading '+sent+'/'+total+'\u2026';
        return post({module:k,row:clean(r)}).then(function(){
          delete r._u;
        });
      });
    });
  });
  
  chain.then(function(){
    save();
    toast('Uploaded all '+total+' entries to Google Sheet!');
  })
  .catch(function(){
    toast('Upload interrupted. Check your internet connection and try again.');
  })
  .then(function(){
    syncing=false;
    ub.disabled=false;sb.disabled=false;
    ub.textContent='\u2191 Upload All Local Data';
  });
}

function syncNow(quiet){
  if(!SHEET_URL||syncing)return;
  if(!quiet&&!confirm('Sync will upload any unsent entries, then replace the list on this device with the data in your Google Sheet. Continue?'))return;
  syncing=true;
  var b=document.getElementById('syncBtn');
  var ub=document.getElementById('uploadAllBtn');
  b.disabled=true;ub.disabled=true;b.textContent='Syncing\u2026';
  var chain=Promise.resolve();
  Object.keys(MOD).forEach(function(k){DB[k].forEach(function(r){
    if(r._u)chain=chain.then(function(){return post({module:k,row:clean(r)}).then(function(){delete r._u;});});});});
  chain.then(function(){save();return post({action:'read'});})
   .then(function(j){
     Object.keys(MOD).forEach(function(k){
       if(j.data[k])DB[k]=j.data[k].concat(DB[k].filter(function(r){return r._u;}));});
     save();toast('Synced with Google Sheet');draw();})
   .catch(function(err){toast(err.message||'Sync failed. Check internet and web app link.');})
   .then(function(){syncing=false;b.disabled=false;ub.disabled=false;b.textContent='\u21BB Sync';});
}

var CENTER={name:'Rainbow Child Development Center',addr:'1st Floor, A Block, Govt. Hospital, H No. 10, Gali Number 1, Opp. Burari Road, Saroop Vihar, Kaushik Enclave, Indraprasth Colony, Burari, Delhi, 110084',mobile:'076783 12089'};
var ONES=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function two(n){return n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:'');}
function three(n){return (n>=100?ONES[Math.floor(n/100)]+' Hundred'+(n%100?' ':''):'')+(n%100?two(n%100):'');}
function words(n){n=Math.round(n);if(!n)return 'Zero';var s='',c=Math.floor(n/10000000),l=Math.floor(n/100000)%100,t=Math.floor(n/1000)%100,x=n%1000;
  if(c)s+=three(c)+' Crore ';if(l)s+=two(l)+' Lakh ';if(t)s+=two(t)+' Thousand ';if(x)s+=three(x);return s.trim();}
function fmtD(d){var p=String(d||'').split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:esc(d);}
function showBill(i){
  var r=DB.fees[i];if(!r)return;
  var no=r.receipt||('R-'+String(i+1).padStart(4,'0'));
  var what=(r.source==='Session'?'Session fee':'School / day care fee')+(r.month?' \u2013 '+r.month:'');
  var amt=Number(r.amount)||0;
  var h='<div class="bar"><button class="btn" onclick="window.print()">Print / Save as PDF</button><button class="btn ghost" style="background:#fff;color:#111" onclick="closeBill()">Close</button></div>'+
  '<div class="sheet"><div class="rb"></div><div class="bh"><h2>'+esc(CENTER.name)+'</h2><p>'+esc(CENTER.addr)+'</p><p><b>Mobile:</b> '+esc(CENTER.mobile)+'</p></div>'+
  '<h3>FEE RECEIPT</h3>'+
  '<div class="meta"><div><b>Receipt no.:</b> '+esc(no)+'</div><div><b>Date:</b> '+fmtD(r.date)+'</div></div>'+
  '<div class="meta"><div><b>Child name:</b> '+esc(r.child)+'</div><div><b>Fee from:</b> '+esc(r.source)+'</div></div>'+
  '<table><thead><tr><th>#</th><th>Description</th><th class="n">Amount</th></tr></thead>'+
  '<tbody><tr><td>1</td><td>'+esc(what)+'</td><td class="n">'+inr(amt)+'</td></tr></tbody>'+
  '<tfoot><tr><td colspan="2" class="n">Total</td><td class="n">'+inr(amt)+'</td></tr></tfoot></table>'+
  '<p><b>Amount in words:</b> Rupees '+words(amt)+' only</p>'+
  '<p><b>Payment mode:</b> '+esc(r.mode)+(r.note?' &nbsp;|&nbsp; <b>Remarks:</b> '+esc(r.note):'')+'</p>'+

var BILLGEN_HTML="<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Rainbow Child Development Center - Bill Generator<\/title>\n<style id=\"pageStyle\">@page{size:A4;margin:0}<\/style>\n<style>\n:root{--ink:#111;--line:#222;--muted:#555;--bg:#eef1f5}\n*{box-sizing:border-box}\nbody{margin:0;padding:24px;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}\n.app{max-width:1100px;margin:auto;display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}\n.controls{background:#fff;border:1px solid #d7dce2;border-radius:10px;padding:18px}\nh1{font-size:19px;margin:0 0 14px}\n.controls h2{font-size:14px;margin:18px 0 9px;padding-bottom:6px;border-bottom:1px solid #e5e7eb}\nlabel{display:block;font-size:12px;font-weight:700;margin:9px 0 4px}\ninput,textarea,select{width:100%;padding:8px 9px;border:1px solid #cbd1d8;border-radius:5px;font:13px Arial;background:#fff}\ntextarea{min-height:54px;resize:vertical}\n.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}\nbutton{border:0;border-radius:6px;padding:9px 12px;font-weight:700;cursor:pointer;background:#1d4ed8;color:#fff}\nbutton.secondary{background:#e5e7eb;color:#111827}\nbutton.danger{background:#b91c1c}\nbutton:disabled{opacity:.5;cursor:not-allowed}\n.hint{color:var(--muted);font-size:11px;line-height:1.45;margin-top:10px}\n.msg{display:none;margin-top:10px;padding:8px 10px;border-radius:6px;background:#fff7ed;border:1px solid #fdba74;font-size:12px}\n.paper-wrap{overflow:auto}\n.invoice{width:210mm;min-height:297mm;margin:0 auto;background:#fff;padding:10mm 9mm 9mm;box-shadow:0 4px 20px #00000018;font-size:10px}\n.invoice table{width:100%;border-collapse:collapse}\n.invoice td,.invoice th{border:1px solid var(--line);padding:4px 5px;vertical-align:middle}\n.brand-title{text-align:center;font-size:17px;font-weight:800;letter-spacing:.25px;padding:4px 0 6px}\n.top :visible}\n .invoice{width:210mm;height:297mm;min-height:0;margin:0;box-shadow:none;padding:8mm 8mm 7mm;overflow:hidden;font-size:9px}\n .invoice td,.invoice th{padding:2px 3px}\n .items td{height:16px}\n .items input{padding:0}\n .therapy-note{padding:4px 2px;line-height:1.3}\n .signature{margin-top:16px}\n body.receipt-mode .invoice{width:72mm;height:auto;padding:0;overflow:visible;zoom:1!important}\n}\n<\/style>\n<\/head>\n<body>\n<div class=\"app\">\n <aside class=\"controls\">\n  <h1>Bill Generator<\/h1>\n  <div class=\"hint\">Edit the fields here, or click text on the bill to edit it directly. Choose the format, then print.<\/div>\n  <h2>Center details<\/h2>\n  <label for=\"centerName\">Center name<\/label><input id=\"centerName\" value=\"RAINBOW CHILD DEVELOPMENT CENTER\">\n  <h2>Therapist details<\/h2>\n  <div id=\"therapistControls\"><\/div>\n  <div class=\"btnrow\"><button type=\"button\" class=\"secondary\" id=\"addTherapistBtn\">+ Add therapist<\/button><\/div>\n  <label for=\"centerAddress\">Center address<\/label><textarea id=\"centerAddress\">1st Floor, A Block, Govt. Hospital, H No. 10, Gali Number 1, Opp. Burari Road, Saroop Vihar, Kaushik Enclave, Indraprasth Colony, Burari, Delhi, 110084<\/textarea>\n  <label for=\"mobile\">Mobile<\/label><input id=\"mobile\" value=\"076783 12089\">\n  <label for=\"email\">Email<\/label><input id=\"email\" value=\"rainbowchildschool@gmail.com\">\n  <h2>Bill &amp; student details<\/h2>\n  <label for=\"billNo\">Bill number<\/label><input id=\"billNo\" value=\"5092\">\n  <label for=\"student\">Student name<\/label><input id=\"student\" value=\"Shabd\">\n  <label for=\"age\">Age<\/label><input id=\"age\" placeholder=\"Enter age\">\n  <label for=\"patientAddress\">Address<\/label><input id=\"patientAddress\">\n  <label for=\"billDate\">Bill date<\/label><input id=\"billDate\" type=\"date\">\n  <label for=\"preparedDate\">Prepared on<\/label><input id=\"preparedDate\" type=\"date\">\n  <h2>Payment<\/h2>\n  <label for=\"paid\">Advance / amount paid (\u20b9)<\/label><input id=\"paid\" type=\"number\" min=\"0\" step=\"0.01\" value=\"15000\">\n  <label for=\"discount\">Discount (\u20b9)<\/label><input id=\"discount\" type=\"number\" min=\"0\" step=\"0.01\" value=\"0\">\n  <h2>Print format<\/h2>\n  <label for=\"printFormat\">Choose format<\/label>\n  <select id=\"printFormat\"><option value=\"a4\">A4 full-page bill<\/option><option value=\"receipt\">Receipt (80 mm)<\/option><\/select>\n  <div class=\"btnrow\">\n   <button type=\"button\" id=\"addRowBtn\">+ Add session<\/button>\n   <button type=\"button\" id=\"printBtn\">Print / Save PDF<\/button>\n   <button type=\"button\" class=\"secondary\" id=\"resetBtn\">Reset sample<\/button>\n  <\/div>\n  <div class=\"msg\" id=\"msg\"><\/div>\n  <p class=\"hint\">In the print window choose \u201cSave as PDF\u201d to make a PDF copy. If Print does nothing, open this file directly in Chrome or Edge (not inside another app or preview) and press Ctrl+P.<\/p>\n <\/aside>\n <main class=\"paper-wrap\">\n  <section class=\"invoice\" id=\"invoice\">\n   <div class=\"brand-title\" data-bind=\"centerName\">RAINBOW CHILD DEVELOPMENT CENTER<\/div>\n   <table class=\"top-grid\"><tr id=\"topRow\"><\/tr><\/table>\n   <table class=\"addr-grid\"><tr><td class=\"address\"><b>Address:<\/b> <span data-bind=\"centerAddress\"><\/span><br><b>Mob.:<\/b> <span data-bind=\"mobile\"><\/span><br><b>E-mail:<\/b> <span data-bind=\"email\"><\/span><\/td><\/tr><\/table>\n   <table class=\"patient\">\n    <tr><td style=\"width:60%\"><strong>Student Name:-<\/strong> <span data-bind=\"student\">Shabd<\/span><\/td><td><strong>Age:-<\/strong> <span data-bind=\"age\"><\/span><\/td><\/tr>\n    <tr><td colspan=\"2\"><strong>Address:-<\/strong> <span data-bind=\"patientAddress\"><\/span><\/td><\/tr>\n    <tr><td><strong>Bill Date:-<\/strong> <span id=\"billDateView\"><\/span><\/td><td><strong>Prepared On:-<\/strong> <span id=\"preparedDateView\"><\/span><\/td><\/tr>\n   <\/table>\n   <div class=\"therapy-note\"><b>1. Occupational Therapy-OT<\/b><br><b>2. Speech Therapy-ST<\/b><br><b>3. Special Education-SE<\/b><\/div>\n   <table class=\"items\">\n    <thead><tr><th style=\"width:8%\">S. No.<\/th><th style=\"width:24%\">Date<\/th><th style=\"width:29%\">TREATMENT/SESSION<\/th><th style=\"width:12%\">CURRENCY<\/th><th>CHARGES FOR THERAPY (\u20b9)<\/th><th class=\"row-action no-print\"><\/th><\/tr><\/thead>\n    <tbody id=\"rows\"><\/tbody>\n   <\/table>\n   <table class=\"totals\">\n    <tr><td class=\"label\">TOTAL CHARGES OF SERVICES/ITEMS:<\/td><td class=\"value\" id=\"grossTotal\"><\/td><\/tr>\n    <tr><td class=\"label\">DISCOUNT:<\/td><td class=\"value\" id=\"discountView\"><\/td><\/tr>\n    <tr><td class=\"label\">NET AMOUNT:<\/td><td class=\"value\" id=\"netTotal\"><\/td><\/tr>\n    <tr><td class=\"label\">AMOUNT PAID:<\/td><td class=\"value\" id=\"paidView\"><\/td><\/tr>\n    <tr><td class=\"label\">BALANCE DUE:<\/td><td class=\"value\" id=\"balance\"><\/td><\/tr>\n   <\/table>\n   <div class=\"amount-words\"><b>AMOUNT IN WORDS:-<\/b> <span id=\"words\"><\/span><\/div>\n   <div class=\"signature\">Authorized Signature<br><b>Amit Saini<\/b><br>Principal<br>Rainbow Child Development Center<\/div>\n  <\/section>\n <\/main>\n<\/div>\n<script>\n(function(){\nvar $=function(id){return document.getElementById(id);};\nvar fieldIds=['centerName','centerAddress','mobile','email','billNo','student','age','patientAddress'];\nvar therapists=[{name:'Dr. Dilip Kumar',qualification:'Speech Therapist',registration:'B-10196'}];\nfunction esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;');}\nfunction fmtDate(v){if(!v)return '';var p=v.split('-');return Number(p[2])+'/'+Number(p[1])+'/'+p[0];}\nfunction todayLocal(){var t=new Date();return new Date(t.getTime()-t.getTimezoneOffset()*60000).toISOString().slice(0,10);}\nfunction say(t){var m=$('msg');m.textContent=t;m.style.display=t?'block':'none';}\n\n/* simple text fields -> bill */\nfunction bindFields(){\n  fieldIds.forEach(function(id){\n    function push(){document.querySelectorAll('[data-bind=\"'+id+'\"]').forEach(function(el){el.textContent=$(id).value;});}\n    $(id).addEventListener('input',push);push();\n  });\n  $('billDate').addEventListener('input',dates);$('preparedDate').addEventListener('input',dates);\n}\nfunction dates(){$('billDateView').textContent=fmtDate($('billDate').value);$('preparedDateView').textContent=fmtDate($('preparedDate').value);}\n\n/* therapists */\nfunction renderTherapists(){\n  var box=$('therapistControls');box.innerHTML='';\n  therapists.forEach(function(t,i){\n    var b=document.createElement('div');b.style.cssText='border:1px solid #d9dee5;border-radius:6px;padding:9px;margin:8px 0';\n    b.innerHTML='<label>Therapist '+(i+1)+' name<\/label><input data-k=\"name\" value=\"'+esc(t.name)+'\" placeholder=\"Therapist name\">'+\n      '<label>Qualification<\/label><input data-k=\"qualification\" value=\"'+esc(t.qualification)+'\" placeholder=\"Qualification\">'+\n      '<label>Registration number<\/label><input data-k=\"registration\" value=\"'+esc(t.registration)+'\" placeholder=\"Registration number\">'+\n      '<div class=\"btnrow\"><button type=\"button\" class=\"danger\" '+(therapists.length===1?'disabled':'')+'>Remove therapist<\/button><\/div>';\n    b.querySelectorAll('input').forEach(function(inp){inp.addEventListener('input',function(){t[inp.getAttribute('data-k')]=inp.value;showTherapists();});});\n    b.querySelector('button').addEventListener('click',function(){if(therapists.length>1){therapists.splice(i,1);renderTherapists();}});\n    box.appendChild(b);\n  });\n  showTherapists();\n}\nfunction showTherapists(){\n  var h=therapists.map(function(t){\n    return '<td class=\"doctor\"><b>'+esc(t.name||'Therapist')+'<\/b>'+(t.qualification?'<br>'+esc(t.qualification):'')+(t.registration?'<br>Reg. No.: '+esc(t.registration):'')+'<\/td>';\n  }).join('');\n  h+='<td class=\"billcol\"><small style=\"font-size:9px;display:block\">Bill No. -<\/small><div class=\"bill-number\"><span data-bind=\"billNo\">'+esc($('billNo').value)+'<\/span><\/div><\/td>';\n  $('topRow').innerHTML=h;\n}\n\n/* session rows */\nfunction addRow(date,session,charge){\n  var tr=document.createElement('tr');\n  tr.innerHTML='<td class=\"center serial\"><\/td><td><input type=\"date\" value=\"'+esc(date||'')+'\" aria-label=\"Session date\"><\/td>'+\n    '<td><input value=\"'+esc(session||'ST')+'\" aria-label=\"Treatment or session\"><\/td><td class=\"center\">INR<\/td>'+\n    '<td><input class=\"charge\" type=\"number\" min=\"0\" step=\"0.01\" value=\"'+esc(charge==null?500:charge)+'\" aria-label=\"Charge in rupees\"><\/td>'+\n    '<td class=\"row-action no-print\"><button type=\"button\" class=\"remove-row\" title=\"Remove row\">\u00d7<\/button><\/td>';\n  tr.querySelectorAll('input').forEach(function(i){i.addEventListener('input',recalc);});\n  tr.querySelector('button').addEventListener('click',function(){tr.remove();recalc();});\n  $('rows').appendChild(tr);recalc();\n}\nfunction money(n){return (Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}\nfunction words(n){\n  n=Math.round(Number(n)||0);if(!n)return 'ZERO RUPEES ONLY';\n  var one=['','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE','TEN','ELEVEN','TWELVE','THIRTEEN','FOURTEEN','FIFTEEN','SIXTEEN','SEVENTEEN','EIGHTEEN','NINETEEN'];\n  var ten=['','','TWENTY','THIRTY','FORTY','FIFTY','SIXTY','SEVENTY','EIGHTY','NINETY'];\n  function u(x){var s='';if(x>=100){s+=one[Math.floor(x/100)]+' HUNDRED ';x%=100;}if(x>=20){s+=ten[Math.floor(x/10)]+' ';x%=10;}if(x>0)s+=one[x]+' ';return s;}\n  var parts=[],units=[[10000000,'CRORE'],[100000,'LAKH'],[1000,'THOUSAND'],[1,'']];\n  units.forEach(function(p){if(n>=p[0]){var q=Math.floor(n/p[0]);parts.push(u(q)+p[1]);n%=p[0];}});\n  return (parts.join(' ').trim()+' RUPEES ONLY').replace(/\\s+/g,' ');\n}\nfunction recalc(){\n  var rows=$('rows').rows,gross=0;\n  Array.prototype.forEach.call(rows,function(r,i){r.querySelector('.serial').textContent=i+1;gross+=Number(r.querySelector('.charge').value)||0;});\n  var disc=Math.max(0,Number($('discount').value)||0),net=Math.max(0,gross-disc),paid=Math.max(0,Number($('paid').value)||0);\n  $('grossTotal').textContent=money(gross);$('discountView').textContent=money(disc);$('netTotal').textContent=money(net);\n  $('paidView').textContent=money(paid);$('balance').textContent=money(Math.max(0,net-paid));$('words').textContent=words(net);\n}\nfunction sample(){\n  $('rows').innerHTML='';\n  var d=['2024-06-01','2024-06-03','2024-06-04','2024-06-05','2024-06-06','2024-06-07','2024-06-08','2024-06-10','2024-06-11','2024-06-12','2024-06-13','2024-06-14','2024-06-15','2024-06-18','2024-06-19','2024-06-20','2024-06-21','2024-06-24','2024-06-25','2024-06-26','2024-06-27','2024-06-28','2024-06-29','2024-06-30'];\n  d.forEach(function(x,i){addRow(x,i===17?'SE+OT':(i%4===0?'OT':i%3===0?'SE':'ST'),i===17?1000:500);});\n}\n\n/* print: page size set by a style tag, so A4 and 80 mm both work in every browser */\nfunction setFormat(f){\n  var rec=f==='receipt';\n  document.body.classList.toggle('receipt-mode',rec);\n  $('pageStyle').textContent=rec?'@page{size:80mm auto;margin:3mm}':'@page{size:A4;margin:0}';\n  $('invoice').style.zoom='';\n}\nfunction fitOnePage(){\n  var inv=$('invoice');inv.style.zoom='';\n  if(document.body.classList.contains('receipt-mode'))return;\n  var avail=inv.clientHeight,content=inv.scrollHeight;\n  if(avail>0&&content>avail)inv.style.zoom=Math.max(0.4,avail/content);\n}\nwindow.addEventListener('beforeprint',fitOnePage);\nwindow.addEventListener('afterprint',function(){$('invoice').style.zoom='';});\n\nfunction enableEditing(){\n  $('invoice').querySelectorAll('td,th,.brand-title,.therapy-note,.amount-words,.signature').forEach(function(el){\n    if(el.querySelector('input,button,select,#therapistPrint')||/^(grossTotal|discountView|netTotal|paidView|balance|words)$/.test(el.id))return;\n    el.setAttribute('contenteditable','true');\n  });\n}\n\n/* buttons */\n$('addRowBtn').addEventListener('click',function(){addRow('','ST',500);});\n$('addTherapistBtn').addEventListener('click',function(){therapists.push({name:'',qualification:'',registration:''});renderTherapists();});\n$('printFormat').addEventListener('change',function(){setFormat(this.value);});\n$('paid').addEventListener('input',recalc);$('discount').addEventListener('input',recalc);\n$('printBtn').addEventListener('click',function(){\n  say('');\n  try{fitOnePage();window.print();}\n  catch(e){say('Printing is blocked here. Open this file directly in Chrome or Edge and press Ctrl+P.');}\n});\nvar armed=false,armTimer;\n$('resetBtn').addEventListener('click',function(){\n  var b=this;\n  if(!armed){armed=true;b.textContent='Click again to confirm';armTimer=setTimeout(function(){armed=false;b.textContent='Reset sample';},3000);return;}\n  clearTimeout(armTimer);armed=false;b.textContent='Reset sample';\n  $('billNo').value='5092';$('student').value='Shabd';$('age').value='';$('patientAddress').value='';$('paid').value='15000';$('discount').value='0';\n  therapists=[{name:'Dr. Dilip Kumar',qualification:'Speech Therapist',registration:'B-10196'}];\n  fieldIds.forEach(function(id){document.querySelectorAll('[data-bind=\"'+id+'\"]').forEach(function(el){el.textContent=$(id).value;});});\n  renderTherapists();sample();\n});\n\nwindow.getBillConfig=function(){return {centerName:$('centerName').value,address:$('centerAddress').value,mobile:$('mobile').value,email:$('email').value,\n  therapists:therapists.map(function(t){return {name:t.name,qualification:t.qualification,registration:t.registration};})};};\n/* lets the School account register fill this bill */\nwindow.loadBill=function(d){\n  if(d.student!=null)$('student').value=d.student;\n  if(d.billNo)$('billNo').value=d.billNo;\n  $('paid').value=d.paid==null?0:d.paid;\n  $('discount').value=0;\n  $('age').value=d.age||'';$('patientAddress').value=d.address||'';\n  fieldIds.forEach(function(id){document.querySelectorAll('[data-bind=\"'+id+'\"]').forEach(function(el){el.textContent=$(id).value;});});\n  $('rows').innerHTML='';\n  (d.rows||[]).forEach(function(r){addRow(r.date,r.session,r.charge);});\n  showTherapists();recalc();\n};\n\n/* start */\n$('billDate').value=todayLocal();$('preparedDate').value=todayLocal();\nbindFields();dates();renderTherapists();sample();enableEditing();\n})();\n<\/script>\n<\/body>\n<\/html>\n";

function home(){
  var fFees=filterByMonth(DB.fees),fFuel=filterByMonth(DB.fuel),fSal=filterByMonth(DB.salary),fExp=filterByMonth(DB.expense),fRep=filterByMonth(DB.repair);
  var inc=sum(fFees),fu=sum(fFuel),sa=sum(fSal,cashOut),ex=sum(fExp),rp=sum(fRep),out=fu+rp+sa+ex,net=inc-out;
  var h='<div class="stats">'+
   '<div class="stat"><span>Fees collected ('+esc(ymLabel(selMonth))+')</span><b>'+inr(inc)+'</b></div>'+
   '<div class="stat"><span>Van fuel</span><b>'+inr(fu)+'</b></div>'+
   '<div class="stat"><span>Van maintenance & repair</span><b>'+inr(rp)+'</b></div>'+
   '<div class="stat"><span>Salary & advances paid</span><b>'+inr(sa)+'</b></div>'+
   '<div class="stat"><span>Wages & expenses</span><b>'+inr(ex)+'</b></div>'+
   '<div class="stat"><span>Balance</span><b class="'+(net<0?'neg':'')+'">'+inr(net)+'</b></div></div>';
  h+=monthWiseSummaryTable();
  h+='<div class="grid2">'+byGroup('Fees by source ('+esc(ymLabel(selMonth))+')',fFees,'source')+byGroup('Fuel by type',fFuel,'fuelType')+byGroup('Van repair by work type',fRep,'work')+
     byGroup('Expenses by category',fExp,'category')+advBal()+'</div>';
  h+='<p class="noprint"><button class="btn ghost" onclick="window.print()">Print summary</button></p>';
  return h;
}
function byGroup(t,rows,k){
  var m={};rows.forEach(function(r){m[r[k]]=(m[r[k]]||0)+(Number(r.amount)||0);});
  var ks=Object.keys(m).sort();
  var b=ks.length?ks.map(function(x){return '<tr><td>'+esc(x)+'</td><td class="n">'+inr(m[x])+'</td></tr>';}).join(''):'<tr><td class="empty" colspan="2">No entries yet.</td></tr>';
  return '<div class="panel"><h2>'+t+'</h2><div class="wrap"><table style="min-width:0"><tbody>'+b+'</tbody></table></div></div>';
}
function advBal(){
  var m={};
  DB.salary.forEach(function(r){var n=r.staff;m[n]=m[n]||0;
    if(r.type==='Advance given')m[n]+=+r.amount||0;if(r.type==='Advance recovered')m[n]-=+r.amount||0;});
  var ks=Object.keys(m).filter(function(n){return m[n]!==0;}).sort();
  var b=ks.length?ks.map(function(n){return '<tr><td>'+esc(n)+'</td><td class="n">'+inr(m[n])+'</td></tr>';}).join(''):'<tr><td class="empty" colspan="2">No advance pending.</td></tr>';
  return '<div class="panel"><h2>Advance pending by staff (Overall)</h2><div class="wrap"><table style="min-width:0"><tbody>'+b+'</tbody></table></div></div>';
}

function module(k){
  var M=MOD[k],h='<div class="panel"><h2>Add entry \u2013 '+M.title+'</h2><form id="f">';
  M.fields.forEach(function(f){
    var ro=f.calc?' readonly tabindex="-1"':'',req=f.opt||f.calc?'':' required';
    h+='<label>'+f.l;
    if(f.t==='sel'){h+='<select name="'+f.k+'">'+f.o.map(function(o){return '<option'+(o===f.def?' selected':'')+'>'+o+'</option>';}).join('')+'</select>';}
    else if(f.t==='num'){h+='<input name="'+f.k+'" type="number" step="any" min="0" inputmode="decimal"'+(f.def?' value="'+f.def+'"':'')+ro+req+'>';}
    else{h+='<input name="'+f.k+'" type="'+f.t+'"'+(f.t==='date'?' value="'+today+'"':'')+(f.ph?' placeholder="'+f.ph+'"':'')+(f.dl?' list="dl_'+f.dl+'"':'')+req+'>';}
    h+='</label>';
  });
  h+='<button class="btn" type="submit">Save entry</button>'+childList()+'</form></div>';
  var monthFiltered=DB[k].map(function(r,i){return {r:r,i:i};}).filter(function(o){return M.plain||selMonth==='ALL'||ymKey(o.r.date)===selMonth;});
  var rows=monthFiltered.filter(function(o){return !q||JSON.stringify(o.r).toLowerCase().indexOf(q)>-1;});
  rows.sort(M.plain?function(a,b){return String(a.r.name||'').localeCompare(String(b.r.name||''));}:function(a,b){return (b.r.date||'').localeCompare(a.r.date||'')||b.i-a.i;});
  h+='<div class="panel"><h2>'+(M.plain?'All children ('+rows.length+')':'Register \u2013 '+esc(ymLabel(selMonth)))+'</h2><div class="tools"><input id="q" type="search" placeholder="Search entries" value="'+esc(q)+'" aria-label="Search entries"><button class="btn ghost" onclick="window.print()">Print</button></div><div class="wrap"><table><thead><tr>';
  M.fields.forEach(function(f){h+='<th class="'+(f.t==='num'?'n':'')+'">'+f.l+'</th>';});
  h+='<th></th></tr></thead><tbody>';
  if(!rows.length)h+='<tr><td class="empty" colspan="'+(M.fields.length+1)+'">'+(M.plain?'No children added yet.':'No entries for '+esc(ymLabel(selMonth))+'.')+'</td></tr>';
  rows.forEach(function(o){
    h+='<tr>';M.fields.forEach(function(f){var v=o.r[f.k];
      h+='<td class="'+(f.t==='num'?'n':'')+'">'+(f.k==='amount'?inr(v):esc(v))+'</td>';});
    h+='<td>'+(k==='fees'?'<span class="noprint"><button class="btn ghost" data-b="'+o.i+'" style="padding:3px 9px;margin-right:6px">Bill</button></span>':'')+'<button class="x" data-d="'+o.i+'" aria-label="Delete entry" title="Delete">\u2715</button></td></tr>';
  });
  var tot=sum(rows.map(function(o){return o.r;}),k==='salary'?cashOut:null);
  if(M.plain){h+='</tbody></table></div></div>';return h;}
  h+='</tbody><tfoot><tr><td colspan="'+M.fields.length+'">Total'+(k==='salary'?' (excluding recoveries)':'')+'</td><td class="n" colspan="1">'+inr(tot)+'</td></tr></tfoot></table></div></div>';
  h+=byGroup('Total by '+M.gl.toLowerCase()+' ('+esc(ymLabel(selMonth))+')',monthFiltered.map(function(o){return o.r;}),M.group);
  return h;
}

function bind(k){
  var f=document.getElementById('f'),M=MOD[k];
  function recalc(){M.fields.forEach(function(x){if(x.calc){var r={};M.fields.forEach(function(y){var e=f.elements[y.k];r[y.k]=y.t==='num'?parseFloat(e.value):e.value;});f.elements[x.k].value=x.calc(r)?+x.calc(r).toFixed(2):'';}});}
  f.oninput=recalc;
  f.onsubmit=function(e){e.preventDefault();var r={};
    M.fields.forEach(function(x){var v=f.elements[x.k].value;r[x.k]=x.t==='num'?(parseFloat(v)||0):v;});
    if(M.fields.some(function(x){return x.k==='amount';})&&!(r.amount>0)){alert('Enter an amount greater than zero.');return;}
    r._u=1;DB[k].push(r);save();sendToSheet(k,r);draw();};
  var s=document.getElementById('q');
  s.oninput=function(){q=s.value.toLowerCase();var p=s.selectionStart;draw();var n=document.getElementById('q');n.focus();n.setSelectionRange(p,p);};
  document.getElementById('view').onclick=function(e){var b=e.target.getAttribute('data-b');if(b!==null){openBillFor(+b);return;}var d=e.target.getAttribute('data-d');
    if(d!==null&&confirm('Delete this entry?')){var gone=DB[k].splice(+d,1)[0];save();if(!gone._u&&SHEET_URL)post({action:'delete',module:k,row:clean(gone)}).catch(function(){});draw();}};
}

function draw(){
  if(isTeacher())tab='attendance';
  drawTabs();
  if(tab==='bill'||(MOD[tab]&&MOD[tab].plain))document.getElementById('monthBar').innerHTML='';else drawMonthBar();
  var v=document.getElementById('view');
  if(tab==='home'){v.innerHTML=home();v.onclick=null;}
  else if(MOD[tab]&&MOD[tab].custom){v.innerHTML=attTab();v.onclick=null;bindAtt();}
  else if(tab==='bill'){v.innerHTML=billTab();v.onclick=null;bindBill();}
  else{v.innerHTML=module(tab);bind(tab);}
}
boot();
</script>
</body>
</html>
