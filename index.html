<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Account Register</title>
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#14283a;--mute:#5d6f7d;--line:#d3dde3;--acc:#0b6e6e;--acc-ink:#fff;--warn:#b3261e;--hi:#e7f3f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--card:#17252f;--ink:#e6eef3;--mute:#93a6b3;--line:#2b3d49;--acc:#4fc0b8;--acc-ink:#0b1a20;--warn:#ff8a80;--hi:#1c3340;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a22;--card:#17252f;--ink:#e6eef3;--mute:#93a6b3;--line:#2b3d49;--acc:#4fc0b8;--acc-ink:#0b1a20;--warn:#ff8a80;--hi:#1c3340;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{padding:18px 16px 8px;max-width:1100px;margin:auto}
h1{margin:0;font-size:1.5rem;letter-spacing:.2px}
header p{margin:2px 0 0;color:var(--mute)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;max-width:1100px;margin:auto}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:8px;font:inherit;cursor:pointer}
nav button[aria-selected="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:1100px;margin:auto;padding:6px 16px 40px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.panel h2{margin:0 0 12px;font-size:1.05rem}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--mute)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%}
input[readonly]{background:var(--hi);font-weight:600}
.btn{border:0;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:600;padding:10px 14px;border-radius:6px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:8px;padding:10px 12px}
.stat span{display:block;color:var(--mute);font-size:.8rem}
.stat b{font-size:1.25rem}
.neg{color:var(--warn)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.8rem;color:var(--mute);font-weight:600}
td.n,th.n{text-align:right}
tfoot td{font-weight:700;background:var(--hi)}
.x{background:none;border:0;color:var(--warn);cursor:pointer;font-size:1rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools input{max-width:240px}
.empty{color:var(--mute);padding:14px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
@media print{nav,form,.tools,.x,.noprint{display:none!important}body{background:#fff;color:#000}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
#billView{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);overflow:auto;padding:14px;z-index:50}
.bar{max-width:210mm;margin:0 auto 10px;display:flex;gap:8px}
.sheet{background:#fff;color:#111;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:0 14mm 14mm;font-size:14px;line-height:1.5}
.sheet .rb{height:8px;margin:0 -14mm;background:linear-gradient(90deg,#e53935,#fb8c00,#fdd835,#43a047,#1e88e5,#8e24aa)}
.sheet .bh{text-align:center;padding:14px 0 10px;border-bottom:2px solid #0b6e6e}
.sheet .bh h2{margin:0 0 4px;font-size:26px;color:#0b6e6e}
.sheet .bh p{margin:2px 0;font-size:12.5px}
.sheet h3{text-align:center;letter-spacing:3px;margin:16px 0 12px;font-size:17px}
.sheet .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sheet table{min-width:0;margin:14px 0}
.sheet th,.sheet td{color:#111;border:1px solid #9aa7ae;padding:8px 10px;white-space:normal}
.sheet th{background:#eaf1f2;color:#111}
.sheet tfoot td{background:#e7f3f2;color:#111;font-size:15px}
.sheet .sign{display:flex;justify-content:space-between;margin-top:90px;font-size:13px}
.sheet .sign div{border-top:1px solid #111;padding-top:4px;min-width:200px;text-align:center}
.sheet .ty{text-align:center;margin-top:40px;color:#444;font-size:12.5px}
@page{size:A4;margin:0}
@media print{body.billing>*:not(#billView){display:none!important}body.billing{background:#fff}#billView{position:static;background:none;padding:0;overflow:visible}.bar{display:none}.sheet{width:210mm;min-height:297mm}}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div>
      <h1>School account register</h1>
      <p>Van fuel, staff pay, expenses and student fees in one place. Entries are saved in this browser and sent to your Google Sheet.</p>
    </div>
    <button id="syncBtn" class="btn noprint" onclick="syncNow()">&#8635; Sync</button>
  </div>
</header>
<nav id="tabs" role="tablist"></nav>
<main id="view"></main>

<script>
var KEY='schoolAccountRegister_v1';
var DB={fuel:[],repair:[],salary:[],expense:[],fees:[]};
try{var s=localStorage.getItem(KEY);if(s)DB=Object.assign(DB,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
var today=new Date().toISOString().slice(0,10);
var SESS=['2025-26','2026-27','2027-28'];
var MONTHS=['April','May','June','July','August','September','October','November','December','January','February','March'];
var MODES=['Cash','UPI','Bank','Cheque'];
var inr=function(n){return '\u20B9'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});};

var MOD={
 fuel:{title:'Van fuel',group:'fuelType',gl:'Fuel type',fields:[
  {k:'date',l:'Date',t:'date'},{k:'van',l:'Van no.',t:'text',ph:'DL 1V 1234'},
  {k:'fuelType',l:'Fuel',t:'sel',o:['CNG','Petrol']},
  {k:'amount',l:'Amount (\u20B9)',t:'num'},{k:'note',l:'Remarks',t:'text',opt:1}]},
 repair:{title:'Van maintenance & repair',group:'work',gl:'Work type',fields:[
  {k:'date',l:'Date',t:'date'},{k:'van',l:'Van no.',t:'text',ph:'DL 1V 1234'},
  {k:'work',l:'Work type',t:'sel',o:['Regular service','Repair','Tyre / tube','Battery','Oil change','CNG kit / cylinder','Insurance / fitness / permit','Cleaning / washing','Other']},
  {k:'shop',l:'Workshop / shop',t:'text',opt:1},
  {k:'amount',l:'Amount (\u20B9)',t:'num'},{k:'mode',l:'Mode',t:'sel',o:MODES},
  {k:'note',l:'Details',t:'text',opt:1}]},
 salary:{title:'Staff salary & advance',group:'type',gl:'Entry type',fields:[
  {k:'date',l:'Date',t:'date'},{k:'staff',l:'Staff name',t:'text'},
  {k:'month',l:'For month',t:'sel',o:MONTHS},
  {k:'type',l:'Entry type',t:'sel',o:['Salary paid','Advance given','Advance recovered']},
  {k:'amount',l:'Amount (\u20B9)',t:'num'},{k:'mode',l:'Mode',t:'sel',o:MODES},
  {k:'note',l:'Remarks',t:'text',opt:1}]},
 expense:{title:'School wages & expenses',group:'category',gl:'Category',fields:[
  {k:'date',l:'Date',t:'date'},
  {k:'category',l:'Category',t:'sel',o:['Wages (helper / driver)','Electricity','Water','Stationery','Repair & maintenance','Events','Rent','Other']},
  {k:'paidTo',l:'Paid to',t:'text'},{k:'amount',l:'Amount (\u20B9)',t:'num'},
  {k:'mode',l:'Mode',t:'sel',o:MODES},{k:'note',l:'Details',t:'text',opt:1}]},
 fees:{title:'Children fees',group:'source',gl:'Fee source',fields:[
  {k:'date',l:'Date',t:'date'},{k:'receipt',l:'Receipt no.',t:'text',opt:1},
  {k:'child',l:'Child name',t:'text'},
  {k:'source',l:'Fee from',t:'sel',o:['Session','School / day care']},
  {k:'amount',l:'Amount (\u20B9)',t:'num'},
  {k:'month',l:'For month',t:'sel',o:MONTHS},
  {k:'mode',l:'Mode',t:'sel',o:MODES},{k:'note',l:'Remarks',t:'text',opt:1}]}
};
var SHEET_URL='https://script.google.com/macros/s/AKfycbyQrk1HLBIUHf5wRYOKCjfkNh-3XGnt7HQP3_VEIJ02EEo_a0gWpQEnzn6fnD2RPTTYag/exec';
var toastTimer;
function toast(m){var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);}
  t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},3000);}
function clean(r){var o={};Object.keys(r).forEach(function(x){if(x.charAt(0)!=='_')o[x]=r[x];});return o;}
function post(p){return fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});}
function sendToSheet(k,r){
  if(!SHEET_URL)return;
  post({module:k,row:clean(r)})
   .then(function(){delete r._u;save();toast('Saved here and sent to Google Sheet');})
   .catch(function(){r._u=1;save();toast('Saved here, not sent yet. Press Sync when online.');});
}
var syncing=false;
function syncNow(){
  if(!SHEET_URL||syncing)return;
  if(!confirm('Sync will upload any unsent entries, then replace the list on this device with the data in your Google Sheet. Continue?'))return;
  syncing=true;var b=document.getElementById('syncBtn');b.disabled=true;b.textContent='Syncing\u2026';
  var chain=Promise.resolve();
  Object.keys(MOD).forEach(function(k){DB[k].forEach(function(r){
    if(r._u)chain=chain.then(function(){return post({module:k,row:clean(r)}).then(function(){delete r._u;});});});});
  chain.then(function(){save();return fetch(SHEET_URL+'?action=read');})
   .then(function(res){return res.json();})
   .then(function(j){
     if(!j.ok)throw new Error(j.error||'Read failed');
     Object.keys(MOD).forEach(function(k){
       if(j.data[k])DB[k]=j.data[k].concat(DB[k].filter(function(r){return r._u;}));});
     save();toast('Synced with Google Sheet');draw();})
   .catch(function(){toast('Sync failed. Check internet and the web app link.');})
   .then(function(){syncing=false;b.disabled=false;b.textContent='\u21BB Sync';});
}
var CENTER={name:'Rainbow Child Development Center',addr:'1st Floor, A Block, Govt. Hospital, H No. 10, Gali Number 1, Opp. Burari Road, Saroop Vihar, Kaushik Enclave, Indraprasth Colony, Burari, Delhi, 110084',mobile:'076783 12089'};
var ONES=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function two(n){return n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:'');}
function three(n){return (n>=100?ONES[Math.floor(n/100)]+' Hundred'+(n%100?' ':''):'')+(n%100?two(n%100):'');}
function words(n){n=Math.round(n);if(!n)return 'Zero';var s='',c=Math.floor(n/10000000),l=Math.floor(n/100000)%100,t=Math.floor(n/1000)%100,x=n%1000;
  if(c)s+=three(c)+' Crore ';if(l)s+=two(l)+' Lakh ';if(t)s+=two(t)+' Thousand ';if(x)s+=three(x);return s.trim();}
function fmtD(d){var p=String(d||'').split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:esc(d);}
function showBill(i){
  var r=DB.fees[i];if(!r)return;
  var no=r.receipt||('R-'+String(i+1).padStart(4,'0'));
  var what=(r.source==='Session'?'Session fee':'School / day care fee')+(r.month?' \u2013 '+r.month:'');
  var amt=Number(r.amount)||0;
  var h='<div class="bar"><button class="btn" onclick="window.print()">Print / Save as PDF</button><button class="btn ghost" style="background:#fff;color:#111" onclick="closeBill()">Close</button></div>'+
  '<div class="sheet"><div class="rb"></div><div class="bh"><h2>'+esc(CENTER.name)+'</h2><p>'+esc(CENTER.addr)+'</p><p><b>Mobile:</b> '+esc(CENTER.mobile)+'</p></div>'+
  '<h3>FEE RECEIPT</h3>'+
  '<div class="meta"><div><b>Receipt no.:</b> '+esc(no)+'</div><div><b>Date:</b> '+fmtD(r.date)+'</div></div>'+
  '<div class="meta"><div><b>Child name:</b> '+esc(r.child)+'</div><div><b>Fee from:</b> '+esc(r.source)+'</div></div>'+
  '<table><thead><tr><th>#</th><th>Description</th><th class="n">Amount</th></tr></thead>'+
  '<tbody><tr><td>1</td><td>'+esc(what)+'</td><td class="n">'+inr(amt)+'</td></tr></tbody>'+
  '<tfoot><tr><td colspan="2" class="n">Total</td><td class="n">'+inr(amt)+'</td></tr></tfoot></table>'+
  '<p><b>Amount in words:</b> Rupees '+words(amt)+' only</p>'+
  '<p><b>Payment mode:</b> '+esc(r.mode)+(r.note?' &nbsp;|&nbsp; <b>Remarks:</b> '+esc(r.note):'')+'</p>'+
  '<div class="sign"><div>Parent / Guardian signature</div><div>Authorised signature</div></div>'+
  '<p class="ty">Thank you.</p></div>';
  var v=document.getElementById('billView');
  if(!v){v=document.createElement('div');v.id='billView';document.body.appendChild(v);}
  v.innerHTML=h;v.style.display='block';document.body.classList.add('billing');
}
function closeBill(){var v=document.getElementById('billView');if(v)v.style.display='none';document.body.classList.remove('billing');}
var tab='home',q='';

function sum(a,f){return a.reduce(function(t,r){return t+(f?f(r):Number(r.amount)||0);},0);}
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function cashOut(r){return r.type==='Advance recovered'?0:Number(r.amount)||0;}

function drawTabs(){
  var h='<button role="tab" data-t="home" aria-selected="'+(tab==='home')+'">Summary</button>';
  Object.keys(MOD).forEach(function(k){h+='<button role="tab" data-t="'+k+'" aria-selected="'+(tab===k)+'">'+MOD[k].title+'</button>';});
  var n=document.getElementById('tabs');n.innerHTML=h;
  n.onclick=function(e){var t=e.target.getAttribute('data-t');if(t){tab=t;q='';draw();}};
}

function home(){
  var inc=sum(DB.fees),fu=sum(DB.fuel),sa=sum(DB.salary,cashOut),ex=sum(DB.expense),rp=sum(DB.repair),out=fu+rp+sa+ex,net=inc-out;
  var h='<div class="stats">'+
   '<div class="stat"><span>Fees collected</span><b>'+inr(inc)+'</b></div>'+
   '<div class="stat"><span>Van fuel</span><b>'+inr(fu)+'</b></div>'+
   '<div class="stat"><span>Van maintenance & repair</span><b>'+inr(rp)+'</b></div>'+
   '<div class="stat"><span>Salary & advances paid</span><b>'+inr(sa)+'</b></div>'+
   '<div class="stat"><span>Wages & expenses</span><b>'+inr(ex)+'</b></div>'+
   '<div class="stat"><span>Balance</span><b class="'+(net<0?'neg':'')+'">'+inr(net)+'</b></div></div>';
  h+='<div class="grid2">'+byGroup('Fees by source (sessions / school)',DB.fees,'source')+byGroup('Fuel by type',DB.fuel,'fuelType')+byGroup('Van repair by work type',DB.repair,'work')+
     byGroup('Expenses by category',DB.expense,'category')+advBal()+'</div>';
  h+='<p class="noprint"><button class="btn ghost" onclick="window.print()">Print summary</button></p>';
  return h;
}
function byGroup(t,rows,k){
  var m={};rows.forEach(function(r){m[r[k]]=(m[r[k]]||0)+(Number(r.amount)||0);});
  var ks=Object.keys(m).sort();
  var b=ks.length?ks.map(function(x){return '<tr><td>'+esc(x)+'</td><td class="n">'+inr(m[x])+'</td></tr>';}).join(''):'<tr><td class="empty" colspan="2">No entries yet.</td></tr>';
  return '<div class="panel"><h2>'+t+'</h2><div class="wrap"><table style="min-width:0"><tbody>'+b+'</tbody></table></div></div>';
}
function advBal(){
  var m={};
  DB.salary.forEach(function(r){var n=r.staff;m[n]=m[n]||0;
    if(r.type==='Advance given')m[n]+=+r.amount||0;if(r.type==='Advance recovered')m[n]-=+r.amount||0;});
  var ks=Object.keys(m).filter(function(n){return m[n]!==0;}).sort();
  var b=ks.length?ks.map(function(n){return '<tr><td>'+esc(n)+'</td><td class="n">'+inr(m[n])+'</td></tr>';}).join(''):'<tr><td class="empty" colspan="2">No advance pending.</td></tr>';
  return '<div class="panel"><h2>Advance pending by staff</h2><div class="wrap"><table style="min-width:0"><tbody>'+b+'</tbody></table></div></div>';
}

function module(k){
  var M=MOD[k],h='<div class="panel"><h2>Add entry \u2013 '+M.title+'</h2><form id="f">';
  M.fields.forEach(function(f){
    var ro=f.calc?' readonly tabindex="-1"':'',req=f.opt||f.calc?'':' required';
    h+='<label>'+f.l;
    if(f.t==='sel'){h+='<select name="'+f.k+'">'+f.o.map(function(o){return '<option'+(o===f.def?' selected':'')+'>'+o+'</option>';}).join('')+'</select>';}
    else if(f.t==='num'){h+='<input name="'+f.k+'" type="number" step="any" min="0" inputmode="decimal"'+(f.def?' value="'+f.def+'"':'')+ro+req+'>';}
    else{h+='<input name="'+f.k+'" type="'+f.t+'"'+(f.t==='date'?' value="'+today+'"':'')+(f.ph?' placeholder="'+f.ph+'"':'')+req+'>';}
    h+='</label>';
  });
  h+='<button class="btn" type="submit">Save entry</button></form></div>';
  var rows=DB[k].map(function(r,i){return {r:r,i:i};}).filter(function(o){return !q||JSON.stringify(o.r).toLowerCase().indexOf(q)>-1;});
  rows.sort(function(a,b){return (b.r.date||'').localeCompare(a.r.date||'')||b.i-a.i;});
  h+='<div class="panel"><h2>Register</h2><div class="tools"><input id="q" type="search" placeholder="Search entries" value="'+esc(q)+'" aria-label="Search entries"><button class="btn ghost" onclick="window.print()">Print</button></div><div class="wrap"><table><thead><tr>';
  M.fields.forEach(function(f){h+='<th class="'+(f.t==='num'?'n':'')+'">'+f.l+'</th>';});
  h+='<th></th></tr></thead><tbody>';
  if(!rows.length)h+='<tr><td class="empty" colspan="'+(M.fields.length+1)+'">No entries yet. Fill the form above and save.</td></tr>';
  rows.forEach(function(o){
    h+='<tr>';M.fields.forEach(function(f){var v=o.r[f.k];
      h+='<td class="'+(f.t==='num'?'n':'')+'">'+(f.k==='amount'?inr(v):esc(v))+'</td>';});
    h+='<td>'+(k==='fees'?'<span class="noprint"><button class="btn ghost" data-b="'+o.i+'" style="padding:3px 9px;margin-right:6px">Bill</button></span>':'')+'<button class="x" data-d="'+o.i+'" aria-label="Delete entry" title="Delete">\u2715</button></td></tr>';
  });
  var tot=sum(rows.map(function(o){return o.r;}),k==='salary'?cashOut:null);
  h+='</tbody><tfoot><tr><td colspan="'+M.fields.length+'">Total'+(k==='salary'?' (excluding recoveries)':'')+'</td><td class="n" colspan="1">'+inr(tot)+'</td></tr></tfoot></table></div></div>';
  h+=byGroup('Total by '+M.gl.toLowerCase(),DB[k],M.group);
  return h;
}

function bind(k){
  var f=document.getElementById('f'),M=MOD[k];
  function recalc(){M.fields.forEach(function(x){if(x.calc){var r={};M.fields.forEach(function(y){var e=f.elements[y.k];r[y.k]=y.t==='num'?parseFloat(e.value):e.value;});f.elements[x.k].value=x.calc(r)?+x.calc(r).toFixed(2):'';}});}
  f.oninput=recalc;
  f.onsubmit=function(e){e.preventDefault();var r={};
    M.fields.forEach(function(x){var v=f.elements[x.k].value;r[x.k]=x.t==='num'?(parseFloat(v)||0):v;});
    if(!(r.amount>0)){alert('Enter an amount greater than zero.');return;}
    r._u=1;DB[k].push(r);save();sendToSheet(k,r);draw();};
  var s=document.getElementById('q');
  s.oninput=function(){q=s.value.toLowerCase();var p=s.selectionStart;draw();var n=document.getElementById('q');n.focus();n.setSelectionRange(p,p);};
  document.getElementById('view').onclick=function(e){var b=e.target.getAttribute('data-b');if(b!==null){showBill(+b);return;}var d=e.target.getAttribute('data-d');
    if(d!==null&&confirm('Delete this entry?')){var gone=DB[k].splice(+d,1)[0];save();if(!gone._u&&SHEET_URL)post({action:'delete',module:k,row:clean(gone)}).catch(function(){});draw();}};
}

function draw(){
  drawTabs();
